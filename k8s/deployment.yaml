apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  labels:
    app: demo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-api
  template:
    metadata:
      labels:
        app: demo-api
    spec:
      containers:
        - name: api
          image: aleavilac/demo-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          # ── LIVENESS ROTA A PROPÓSITO ─────────────────────────
          # Apunta a una ruta inexistente → el pod arranca bien
          # (readinessProbe pasa) pero K8s lo mata y reinicia
          # repetidamente → CrashLoopBackOff → rollout status
          # agota el timeout → rollback automático se activa.
          livenessProbe:
            httpGet:
              path: /ruta-que-no-existe
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 2
