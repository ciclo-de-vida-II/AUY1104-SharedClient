# ─────────────────────────────────────────────────────────────
# Service ÚNICO: selecciona por 'app', sin 'track'.
# Por eso reparte tráfico entre TODOS los pods (stable + canary)
# en proporción a la cantidad de réplicas de cada uno — así se
# logra la "exposición controlada" del Canary sin tocar Ingress.
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: __APP_NAME__
  labels:
    app: __APP_NAME__
spec:
  type: NodePort
  selector:
    app: __APP_NAME__
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30090
