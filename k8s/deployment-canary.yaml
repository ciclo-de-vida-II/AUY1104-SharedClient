# ─────────────────────────────────────────────────────────────
# Deployment CANARY (track: canary).
# El pipeline lo renderiza en cada ejecución (sed) e inyecta:
#   __APP_NAME__, __IMAGE__, __CANARY_TAG__, __CANARY_REPLICAS__
# Vive solo durante la validación: si se promueve o se hace
# rollback, termina en 0 réplicas.
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __APP_NAME__-canary
  labels:
    app: __APP_NAME__
    track: canary
spec:
  replicas: __CANARY_REPLICAS__
  selector:
    matchLabels:
      app: __APP_NAME__
      track: canary
  template:
    metadata:
      labels:
        app: __APP_NAME__
        track: canary
    spec:
      containers:
        - name: api
          image: __IMAGE__:__CANARY_TAG__
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
